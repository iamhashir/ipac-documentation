name: Validate documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel deploys this site. This workflow only gates quality: it fails on
# TypeScript errors, broken internal links, broken anchors and build errors.
jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate
